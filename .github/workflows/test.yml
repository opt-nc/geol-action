name: Test Geol Installation

on:
  push:
    branches: [ main, develop]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-install-latest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      - name: Install Geol
        uses: ./
      
      - name: Verify Geol Installation
        run: |
          geol about
          
  test-install:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      - name: Install Geol
        uses: ./
        with:
          version: 'v2.12.1'
      
      - name: Verify Geol Installation
        run: |
          geol about
