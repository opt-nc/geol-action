name: 'Geol Action'
description: 'Installs geol via the install.sh script from the geol repo'

inputs:
  version:
    description: 'The version of geol to install. Defaults to "latest".'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Install geol
      shell: bash
      run: curl -fsSL https://raw.githubusercontent.com/opt-nc/geol/main/install.sh | bash -s ${{ inputs.version }}