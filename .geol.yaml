geolVersion: "2"
# cuelang file : https://github.com/opt-nc/geol/blob/main/geol_stack.cue
app_name: MySuperApp
app_id: mysuperapp

stack:
  - name: ubuntu
    version: "26.04"
    id_eol: ubuntu

  - name: java temurin
    version: "21"
    id_eol: eclipse-temurin
    lts_strategy: any
    #lts_grace_days: 30 only if the lts_strategy is set to latest, this field is ignored if the lts_strategy is set to any

  - name: quarkus
    version: "3.38"
    id_eol: quarkus-framework

  - name: postgresql
    version: "14"
    id_eol: psql

  - name: opensearch
    version: "2"
    id_eol: opensearch

  - name: maven
    version: "3.6"
    id_eol: apache-maven

  # Example: Using manual_eol for products not yet in endoflife.date API
  # The manual_eol field allows you to:
  # - Set a custom EOL date for products not available in the API
  # - Track EOL status in your reports with manual dates
  # - Get warnings/alerts based on the manual EOL date
  - name: gcc
    version: "12"
    id_eol: gcc
    manual_eol: "2025-07-11"

  # Example: Using the always-latest flag for products that should always be
  # on the latest version
  #
  # The always-latest field allows you to:
  # - Mark products that your organization requires to be on the latest version
  # - Get warnings/alerts when not using the most recent release
  # - Enforce up-to-date policies for critical components
  - name: traefik-latest
    version: "3.2"
    id_eol: traefik
    always-latest: true

